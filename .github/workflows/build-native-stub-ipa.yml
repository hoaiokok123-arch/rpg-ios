name: Build Native Stub IPA

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native-stub-ipa:
    name: Build Native Stub IPA
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v6

      - name: Prepare local engine templates
        run: |
          mkdir -p external
          cp -R BuildSupport/EngineForkTemplates/EasyRPGBridgePort external/EasyRPG-Player
          cp -R BuildSupport/EngineForkTemplates/MKXPZBridgePort external/mkxp-z

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build EasyRPG stub framework
        run: |
          chmod +x Scripts/build_engine_from_repo_contract.sh
          ./Scripts/build_engine_from_repo_contract.sh \
            "EasyRPG" \
            "EasyRPGBridge" \
            "${GITHUB_WORKSPACE}/external/EasyRPG-Player" \
            "${GITHUB_WORKSPACE}/Vendor"

      - name: Build mkxp-z stub framework
        run: |
          chmod +x Scripts/build_engine_from_repo_contract.sh
          ./Scripts/build_engine_from_repo_contract.sh \
            "mkxp-z" \
            "MKXPZBridge" \
            "${GITHUB_WORKSPACE}/external/mkxp-z" \
            "${GITHUB_WORKSPACE}/Vendor"

      - name: Show vendor frameworks
        run: find Vendor -maxdepth 3 -print | sort

      - name: Generate Xcode project
        run: |
          chmod +x Scripts/generate_xcode_project.sh
          ./Scripts/generate_xcode_project.sh

      - name: Install CocoaPods dependencies
        run: bundle exec pod install

      - name: Show available schemes
        run: xcodebuild -list -workspace RPGPlayerClone.xcworkspace

      - name: Build iPhoneOS app with native stubs
        run: |
          set -euo pipefail
          mkdir -p build
          LOG_PATH="build/xcodebuild-native-stub.log"

          xcodebuild \
            -workspace RPGPlayerClone.xcworkspace \
            -scheme RPGPlayerClone \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_PREVIEWS=NO \
            ENABLE_DEBUG_DYLIB=NO \
            ONLY_ACTIVE_ARCH=NO \
            build | tee "${LOG_PATH}" | bundle exec xcpretty

      - name: Package native stub IPA
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/RPGPlayerClone.app"
          ARTIFACT_DIR="build/Artifacts"
          PAYLOAD_DIR="${ARTIFACT_DIR}/Payload"
          IPA_PATH="${ARTIFACT_DIR}/RPGPlayerClone-native-stub-unsigned.ipa"

          if [[ ! -d "${APP_PATH}" ]]; then
            echo "App bundle not found at ${APP_PATH}" >&2
            find build/DerivedData/Build/Products -maxdepth 3 -print >&2 || true
            exit 1
          fi

          rm -rf "${ARTIFACT_DIR}"
          mkdir -p "${PAYLOAD_DIR}"
          ditto "${APP_PATH}" "${PAYLOAD_DIR}/RPGPlayerClone.app"

          (
            cd "${ARTIFACT_DIR}"
            ditto -c -k --sequesterRsrc --keepParent Payload "RPGPlayerClone-native-stub-unsigned.ipa"
          )

          ls -lh "${IPA_PATH}"

      - name: Upload native stub frameworks
        uses: actions/upload-artifact@v6
        with:
          name: RPGPlayerClone-native-stub-xcframeworks
          path: |
            Vendor/EasyRPGBridge.xcframework
            Vendor/MKXPZBridge.xcframework
          if-no-files-found: error
          compression-level: 0

      - name: Upload native stub IPA
        uses: actions/upload-artifact@v6
        with:
          name: RPGPlayerClone-native-stub-unsigned-ipa
          path: build/Artifacts/RPGPlayerClone-native-stub-unsigned.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Upload native stub build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: RPGPlayerClone-native-stub-build-logs
          path: |
            build/xcodebuild-native-stub.log
            build/DerivedData/Logs
            Vendor
          if-no-files-found: warn
