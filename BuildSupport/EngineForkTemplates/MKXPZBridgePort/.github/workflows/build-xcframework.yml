name: Build MKXPZBridge XCFramework

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-xcframework:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build XCFramework
        run: |
          chmod +x ci/build_ios_xcframework.sh
          OUTPUT_DIR="${GITHUB_WORKSPACE}/artifacts" ./ci/build_ios_xcframework.sh

      - name: Upload XCFramework
        uses: actions/upload-artifact@v6
        with:
          name: MKXPZBridge-xcframework
          path: artifacts/MKXPZBridge.xcframework
          if-no-files-found: error
          compression-level: 0
