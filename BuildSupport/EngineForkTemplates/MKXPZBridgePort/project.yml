name: MKXPZBridge

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    PRODUCT_NAME: MKXPZBridge
    PRODUCT_MODULE_NAME: MKXPZBridge
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SKIP_INSTALL: NO
    BUILD_LIBRARY_FOR_DISTRIBUTION: YES
    DEFINES_MODULE: YES
    ENABLE_BITCODE: NO
    SUPPORTS_MACCATALYST: NO

targets:
  MKXPZBridge:
    type: framework
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Bridge

schemes:
  MKXPZBridge:
    build:
      targets:
        MKXPZBridge: all
    archive:
      config: Release
